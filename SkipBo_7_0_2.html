<!DOCTYPE html>
<!--
  ================================================================
  SKIPO (Skip-Bo Mobile) – VERSION 7.0.2   (04.09.2026)
  ----------------------------------------------------------------
  Basis: Neuarchitektur 7.0.1 (vier Schichten, ein Namensraum je
  Datei, Ereignisbus, Meldungsschlüssel, ein Speicher-Zugang).
  Neu in 7.0.2:
    • Blockade-Taktik (ki-taktik.js): Die KI verweigert Züge, die
      einen Baustapel für die sichtbare Gegner-Stockkarte öffnen,
      und hebt Joker für Planer-Ketten auf. Gemessen mit tune-sim.js:
      59 % Siegrate gegen 7.0.1 (2000 gepaarte Spiele).
    • Auswertung beider Seiten im Endscreen (Spieler vs. KI).
  KI_TAKTIK.ENABLED = false → Verhalten exakt wie 7.0.1/7.0.0.

  Alle Dateien liegen FLACH im Ordner Skipo (kein Unterordner).
  Ladereihenfolge = Abhängigkeit (siehe Projekt.md).
  Bei einem Release alle "?v=7.0.2" gemeinsam hochzählen.
  ================================================================
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
             user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color"                             content="#1B5E20">
  <meta name="apple-mobile-web-app-capable"            content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"   content="black-translucent">
  <title>Skipo – Skip-Bo Mobile v7.0.2</title>

  <link rel="stylesheet" href="https://dietertepe.github.io/Skipo/style.css?v=7.0.2">
</head>
<body>

  <!-- STATUS-BALKEN (verschiebbar) -->
  <div id="status-label">
    <span id="status-text">🎮 Spielstart: Karten werden gemischt...</span>
  </div>

  <!-- ⚙️-MENÜ-BUTTON (separat vom Label, damit Drag ihn nicht blockiert) -->
  <button id="menu-btn" title="Menü">⚙️</button>

  <!-- SCHNELLMENÜ: jeder Button trägt data-action → Menu.actions -->
  <div id="quick-menu">
    <div id="app-version" class="qm-version">Skipo v7.0.2</div>
    <button class="qm-btn" data-action="settings"></button>
    <button class="qm-btn" data-action="design"></button>
    <button class="qm-btn" data-action="rules"></button>
    <button class="qm-btn" data-action="lang"></button>
    <button class="qm-btn" data-action="newgame"></button>
    <button class="qm-btn" data-action="tuner-reset"></button>
    <button class="qm-btn" data-action="imprint"></button>
    <button class="qm-btn" data-action="privacy"></button>
    <button class="qm-btn qm-btn-close" data-action="close"></button>
  </div>

  <div class="game-container">

    <!-- GEGNER-BEREICH -->
    <section class="opponent-area">
      <div class="hand" id="opponentHand"></div>
      <div class="main-piles">
        <div class="field stock"></div>
        <div class="field discard-field"></div>
        <div class="field discard-field"></div>
        <div class="field discard-field"></div>
        <div class="field discard-field"></div>
      </div>
    </section>

    <!-- BAU-BEREICH -->
    <section class="build-area">
      <div class="main-piles">
        <div class="field draw-pile"></div>
        <div class="field build-pile"></div>
        <div class="field build-pile"></div>
        <div class="field build-pile"></div>
        <div class="field build-pile"></div>
      </div>
    </section>

    <!-- SPIELER-BEREICH -->
    <section class="human-area">
      <div class="main-piles">
        <div class="field discard-field"></div>
        <div class="field discard-field"></div>
        <div class="field discard-field"></div>
        <div class="field discard-field"></div>
        <div class="field stock"></div>
      </div>
      <div class="hand" id="playerHand"></div>
    </section>

  </div><!-- /.game-container -->

  <!-- INFO-FENSTER (Ablagestapel-Inhalt bei langem Drücken) -->
  <div id="info-window">
    <table id="info-table"></table>
  </div>

  <!-- ── Konfiguration (Tuner-Schnittstelle, unverändert) ── -->
  <script src="https://dietertepe.github.io/Skipo/konfig.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ki-planner.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ki-taktik.js?v=7.0.2"></script>
  <!-- ── core: Fundament (kein DOM) ── -->
  <script src="https://dietertepe.github.io/Skipo/core-events.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/core-store.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/core-settings.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/core-i18n.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/core-state.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/core-rules.js?v=7.0.2"></script>
  <!-- ── ai: Künstliche Intelligenz (kein DOM) ── -->
  <script src="https://dietertepe.github.io/Skipo/ai-turn.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ai-planner.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ai-eval.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ai-analysis.js?v=7.0.2"></script>
  <!-- ── flow + tracking ── -->
  <script src="https://dietertepe.github.io/Skipo/core-flow.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/tracking.js?v=7.0.2"></script>
  <!-- ── ui: Oberfläche ── -->
  <script src="https://dietertepe.github.io/Skipo/ui-render.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ui-input.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ui-menu.js?v=7.0.2"></script>
  <script src="https://dietertepe.github.io/Skipo/ui-overlays.js?v=7.0.2"></script>
  <!-- ── Start ── -->
  <script src="https://dietertepe.github.io/Skipo/app.js?v=7.0.2"></script>
</body>
</html>
