<!DOCTYPE html>
<!--
  ================================================================
  SKIPO – WEITERLEITUNG   (14.11.2026)
  ----------------------------------------------------------------
  Diese Adresse war die Startseite von Version 7.0.1. Sie lädt
  dieselben JS-Dateien wie die aktuelle Version, aber ohne
  ki-taktik.js – sie würde deshalb immer auf Stufe „Leicht" spielen,
  egal was in den Einstellungen gewählt ist. Darum leitet sie auf
  die aktuelle Startseite weiter.

  Bei der nächsten Version: Ziel unten (3 Stellen) auf die neue
  Startdatei setzen und die bisherige Startdatei ebenfalls durch
  eine solche Weiterleitung ersetzen.
  ================================================================
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B5E20">
  <title>Skipo – weiter zur aktuellen Version</title>

  <!-- 1) Weiterleitung ohne JavaScript -->
  <meta http-equiv="refresh" content="0; url=https://dietertepe.github.io/Skipo/SkipBo_7_0_3.html">
  <link rel="canonical" href="https://dietertepe.github.io/Skipo/SkipBo_7_0_3.html">

  <!-- 2) Weiterleitung mit JavaScript (ersetzt den Verlaufseintrag, „Zurück" führt nicht in eine Schleife) -->
  <script>
    location.replace('https://dietertepe.github.io/Skipo/SkipBo_7_0_3.html');
  </script>

  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1B5E20; color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    }
    a { color: #FFD700; font-weight: 700; }
  </style>
</head>
<body>
  <!-- 3) Falls beides nicht greift: sichtbarer Link -->
  <p>
    Skipo hat eine neue Version.<br>
    <a href="https://dietertepe.github.io/Skipo/SkipBo_7_0_3.html">Weiter zum Spiel</a>
  </p>
